<!-- JLCode's mark: a shell prompt. `>_` is the one glyph pair that still reads
     as "a coding agent" at 16 pixels, where letterforms turn to mush. Colours
     are the app's own panel and accent tokens (styles.css), so a pinned tab
     matches the window it opens. (No double hyphen anywhere in here: XML
     forbids it inside a comment, and the whole file then fails to parse — with
     no error a browser shows, just a broken image. Seen in the P8e peek.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#171a21"/>
  <g fill="none" stroke="#6ea8fe" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9,10 15,16 9,22"/>
    <line x1="18" y1="22.5" x2="24" y2="22.5"/>
  </g>
</svg>
